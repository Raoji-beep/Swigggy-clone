<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero">

        <!-- Navbar -->
        <header class="navbar">
            <div class="logo">
                <div class="logo-icon">S</div>
                <h2>Swiggy</h2>
            </div>

            <nav>
                <a href="#">Swiggy Corporate</a>
                <a href="#">Partner with us</a>
                <a href="#" class="app-btn">Get the App ↗</a>
                <a href="#" class="signin-btn">Sign in</a>
            </nav>
        </header>

        <!-- Side Images -->
        <img class="left-image"
             src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500"
             alt="Fresh vegetables">

        <img class="right-image"
             src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500"
             alt="Sushi">

        <!-- Main Heading -->
        <div class="hero-content">
            <h1>
                Order food & groceries. Discover<br>
                best restaurants. Swiggy it!
            </h1>

            <div class="search-box">
                <div class="location">
                    <span>📍</span>
                    <input type="text" placeholder="Enter your delivery location">
                    <span>⌄</span>
                </div>

                <div class="search">
                    <input type="text" placeholder="Search for restaurant, item or more">
                    <span>⌕</span>
                </div>
            </div>
        </div>

        <!-- Service Cards -->
        <div class="services">

            <div class="service-card">
                <h2>FOOD DELIVERY</h2>
                <p>FROM RESTAURANTS</p>
                <span class="offer">UPTO 60% OFF</span>

                <div class="arrow">→</div>

                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300"
                     alt="Food Delivery">
            </div>

            <div class="service-card">
                <h2>INSTAMART</h2>
                <p>INSTANT GROCERY</p>
                <span class="offer">UPTO 60% OFF</span>

                <div class="arrow">→</div>

                <img src= "images/supermarket-snack.png"
                     alt="Instamart">
            </div>

            <div class="service-card">
                <h2>DINEOUT</h2>
                <p>EAT OUT & SAVE MORE</p>
                <span class="offer">UPTO 50% OFF</span>

                <div class="arrow">→</div>

                <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=300"
                     alt="Dineout">
            </div>

        </div>

    </section>

</body>
</html>
